[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-deal-radar-agents"
version = "0.1.0"
description = "Autonomous multi-agent deal radar with weighted frontier/specialist/neural ensemble pricing and landed-cost alerts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
deal-radar = "deal_radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
